<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>لوحة تحكم المطور — صدى شات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f5fa; --panel:#ffffff; --ink:#102a43; --muted:#627d98; --line:#d9e2ec;
  --brand:#0284c7; --brand-ink:#fff; --brand-soft:#e0f2fe; --accent:#0ea5e9;
  --shadow:0 6px 24px rgba(2,132,199,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.wrapper{max-width:500px;margin:40px auto;padding:20px}
.card{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:30px 24px;border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo i{width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:24px}
.logo b{font-size:28px;font-weight:800}
.tag{color:var(--muted);margin-bottom:24px;font-size:14.5px}

.control-group{margin-bottom:20px}
label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}
select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:0}
select:focus{border-color:var(--brand)}

.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:16px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.2s}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{opacity:.9}
.btn-lock{background:#10b981;color:#fff}
.btn-lock.locked{background:#ef4444;color:#fff}

#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1}

.status-box{display:flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:700;margin-bottom:20px;font-size:14px;text-align:center}
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="logo"><i>🛠️</i><b>لوحة المطورين</b></div>
    <p class="tag">إدارة والتحكم الكامل في تطبيق صدى شات</p>

    <div class="status-box" id="statusBox">جاري الاتصال...</div>

    <div class="control-group">
      <label for="roomSelect">اختر الغرفة المراد إدارتها</label>
      <select id="roomSelect">
        <option value="lounge">🏠 الصالة العامة</option>
        <option value="friends">🤝 تعارف وصداقة</option>
        <option value="games">🎮 ألعاب</option>
        <option value="sports">⚽ رياضة</option>
        <option value="music">🎵 فن وموسيقى</option>
      </select>
    </div>

    <button class="btn btn-danger" id="clearBtn">🗑️ مسح جميع رسائل هذه الغرفة</button>
    <button class="btn btn-lock" id="lockBtn">🔒 قفل الموقع بالكامل</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, remove, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD-Jb5nyYTOgPRuZz2qcmlphr3A25xbcjA",
    authDomain: "sada-75e61.firebaseapp.com",
    databaseURL: "https://sada-75e61-default-rtdb.firebaseio.com",
    projectId: "sada-75e61",
    storageBucket: "sada-75e61.firebasestorage.app",
    messagingSenderId: "245652466091",
    appId: "1:245652466091:web:711a2a03071dc067074aee"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const $ = s => document.querySelector(s);
  let isLocked = false;

  // مراقبة حالة قفل الموقع بشكل حي
  onValue(ref(db, 'settings/locked'), (snapshot) => {
    isLocked = snapshot.val() === true;
    const box = $('#statusBox');
    const btn = $('#lockBtn');
    
    if (isLocked) {
      box.textContent = '⚠️ حالة الشات: مقفل حالياً (المستخدمون لا يستطيعون الإرسال)';
      box.style.background = '#fef2f2';
      box.style.color = '#ef4444';
      btn.textContent = '🔓 فتح الموقع (السماح بالإرسال)';
      btn.classList.add('locked');
    } else {
      box.textContent = '✅ حالة الشات: مفتوح ويعمل بشكل طبيعي';
      box.style.background = '#ecfdf5';
      box.style.color = '#10b981';
      btn.textContent = '🔒 قفل الموقع بالكامل (إيقاف الإرسال)';
      btn.classList.remove('locked');
    }
  });

  // زر قفل وفتح الموقع
  $('#lockBtn').onclick = async () => {
    try {
      const newStatus = !isLocked;
      await set(ref(db, 'settings/locked'), newStatus);
      toast(newStatus ? 'تم قفل الموقع بنجاح' : 'تم فتح الموقع بنجاح');
    } catch (e) {
      console.error(e);
      toast('تعذر تغيير حالة القفل، تحقق من القواعد في Firebase');
    }
  };

  // زر حذف رسائل الغرفة
  $('#clearBtn').onclick = async () => {
    const roomId = $('#roomSelect').value;
    const roomName = $('#roomSelect').selectedOptions[0].text;
    
    if (confirm(`هل أنت متأكد تماماً من حذف جميع رسائل (${roomName})؟`)) {
      try {
        await remove(ref(db, 'rooms/' + roomId + '/messages'));
        toast('تم مسح الرسائل بنجاح');
      } catch (e) {
        toast('فشل مسح الرسائل');
      }
    }
  };

  let tt;
  function toast(s) {
    const t = $('#toast');
    t.textContent = s;
    t.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => t.classList.remove('on'), 2500);
  }
</script>
</body>
</html>
